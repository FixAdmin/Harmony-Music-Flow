name: Build unsigned Windows artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.2
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Create portable archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "Harmony-Music-Flow-Windows-unsigned.zip"

      - name: Upload portable archive
        uses: actions/upload-artifact@v7
        with:
          name: harmony-music-flow-windows-unsigned
          path: Harmony-Music-Flow-Windows-unsigned.zip
          if-no-files-found: error
